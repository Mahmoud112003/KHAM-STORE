<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1K5P5TSDK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-W1K5P5TSDK');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHAM | Catalog</title>
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="asset/css/responsive.css">
    <link rel="stylesheet" href="asset/css/all.min.css">
</head>

<body>
<!-- شاشة تحميل متجر خام -->
<div id="kham-loader" class="kham-loader-wrapper">
    <div class="kham-spinner"></div>
    <div class="kham-brand-text">KHAM</div>
</div>
    <!-- NAV -->
    <div id="nav-placeholder"></div>

    <!-- HERO -->
    <section class="hero">
        <div class="ticker-container">
            <div class="ticker-text">
                <p data-i18n="heroBest">BACK TO ROOTS</p>
            </div>
        </div>
    </section>

    <section class="products-catalog container">

        <h2 class="catalog-main-title" data-i18n="catalogTitle">Products</h2>
        <div class="catalog-toolbar">
            <div class="toolbar-left">
                <span class="label" data-i18n="filterLabel">Filter:</span>
                <div class="custom-dropdown">
                    <div class="dropdown-trigger" data-i18n="availabilityLabel">Availability <i
                            class="fa-solid fa-chevron-down"></i></div>
                    <div class="dropdown-content">
                        <label><input type="checkbox" class="filter-check" value="in-stock"> <span
                                data-i18n="inStock">In stock</span></label>
                        <label><input type="checkbox" class="filter-check" value="out-of-stock"> <span
                                data-i18n="soldOut">Sold out</span></label>
                    </div>
                </div>

            </div>

            <div class="toolbar-right">
                <span class="label" data-i18n="sortBy">Sort by:</span>
                <div class="custom-dropdown">
                    <div class="dropdown-trigger" id="currentSort" data-i18n="sortAz">Alphabetically, A-Z <i
                            class="fa-solid fa-chevron-down"></i></div>
                    <div class="dropdown-content">
                        <div class="sort-option" data-sort="az" data-i18n="sortAz">Alphabetically, A-Z</div>
                        <div class="sort-option" data-sort="price-low" data-i18n="sortLow">Price, low to high</div>
                        <div class="sort-option" data-sort="price-high" data-i18n="sortHigh">Price, high to low</div>
                    </div>
                </div>
                <span class="products-count" id="productCount" data-i18n="productsCount">0 products</span>
            </div>
        </div>

        <div class="products-grid" id="mainGrid"></div>

    </section>

    <!-- بداية: قسم طريقة الغسيل -->
    <section class="product-accordion container">
        <div class="accordion-item">
            <button class="accordion-header" id="washingAccordionBtn">
                <div class="header-title">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 8h16l-1.5 10h-13L4 8z" fill="none" stroke="currentColor" stroke-width="1.5" />
                        <path d="M4 8s2 2 4 0 2.5-2 4 0 2 2 4 0" fill="none" stroke="currentColor" stroke-width="1.5" />
                    </svg>
                    <span>طريقه الغسيل - WASHING</span>
                </div>
                <svg viewBox="0 0 24 24" id="accordionArrow" class="accordion-arrow">
                    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <div class="accordion-body" id="washingAccordionBody">
                <div class="accordion-content">
                    <img src="asset/images/washing-instructions.png" alt="Washing Instructions">
                </div>
            </div>

        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script type="module" src="asset/js/store.js"></script>
    <script type="module" src="asset/js/product.js"></script>
    <script type="module" src="asset/js/cart.js"></script>
    <script type="module" src="asset/js/main.js"></script>
    <script type="module" src="asset/js/i18n.js"></script>
    <script type="module" src="asset/js/all.min.js"></script>

</body>

</html>
