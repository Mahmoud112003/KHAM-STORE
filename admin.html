<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHAM Admin</title>
    <link rel="stylesheet" href="asset/css/admin.css">
    <link rel="stylesheet" href="asset/css/motion.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="admin-container">
        <div class="dashboard-header">
            <div>
                <h1 data-i18n="adminTitle">لوحة تحكم KHAM </h1>
                <p class="dashboard-subtitle" data-i18n="adminSubtitle">إدارة الأقسام والمنتجات الجديدة</p>
            </div>
            <div class="admin-actions">
                <button onclick="logoutAdmin()" class="logout-btn" data-i18n="logout">خروج</button>
                <button onclick="clearAllData()" class="clear-btn" data-i18n="clearData">مسح البيانات</button>
            </div>
        </div>

        <form id="productForm">
            <div class="form-grid">
                <div class="form-group">
                    <label data-i18n="productName">اسم المنتج</label>
                    <input type="text" id="adminProductName" required placeholder="مثلاً: Oversized Hoodie">
                </div>

                <div class="form-group">
                    <label data-i18n="productPrice">السعر (EGP)</label>
                    <input type="number" id="adminProductPrice" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label data-i18n="mainSection">القسم الرئيسي (Collection)</label>
                    <select id="adminProductSection">
                        <option value="Oversized Hoodie Basic">Oversized Hoodie Basic</option>
                        <option value="Oversized Hoodie Printed">Oversized Hoodie Printed</option>
                        <option value="T-shirt Basic">T-shirt Basic</option>
                        <option value="T-shirt Printed">T-shirt Printed</option>
                        <option value="Sweatpants">Sweatpants</option>
                        <option value="Jeans">Jeans</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-i18n="subCategory">النوع الفرعي (Sub-Category)</label>
                    <select id="adminProductSubCategory">
                        <option value="">اختر النوع (Sub-Category)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-i18n="availabilityStatus">حالة توفر المنتج</label>
                    <select id="adminProductStatus" required>
                        <option value="in-stock">متوفر (In Stock)</option>
                        <option value="out-of-stock">نفذت الكمية (Sold Out)</option>
                    </select>
                </div>

            </div>

            <section class="product-colors-editor" aria-labelledby="productColorsHeading">
                <div class="product-colors-heading">
                    <h2 id="productColorsHeading" data-i18n="colorsLabel">Product colors</h2>
                    <button type="button" id="addProductColor" class="admin-secondary-btn" data-i18n="addColor">Add
                        color</button>
                </div>
                <div id="productColorList" class="product-color-list"></div>
            </section>

            <div class="form-group" style="margin-top: 15px;">
                <label data-i18n="descriptionLabel">وصف المنتج التفصيلي</label>
                <textarea id="adminProductDesc" rows="4" placeholder="اكتب تفاصيل ومميزات القطعة هنا..."></textarea>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; margin-bottom: 10px;" data-i18n="sizesLabel">المقاسات المتاحة</label>
                <div class="sizes-container" style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <label><input type="checkbox" class="size-checkbox" value="S"> S</label>
                    <label><input type="checkbox" class="size-checkbox" value="M"> M</label>
                    <label><input type="checkbox" class="size-checkbox" value="L"> L</label>
                    <label><input type="checkbox" class="size-checkbox" value="XL"> XL</label>
                    <label><input type="checkbox" class="size-checkbox" value="XXL"> XXL</label>
                    <label><input type="checkbox" class="size-checkbox" value="XXXL"> XXXL</label>
                </div>
            </div>

            <section id="adminProductInventoryEditor" class="color-inventory-editor"
                aria-label="Product size inventory">
                <label class="color-inventory-toggle" for="adminProductTrackInventory">
                    <input type="checkbox" id="adminProductTrackInventory">
                    <span>Track inventory by size (for products without colors)</span>
                </label>
                <div id="adminProductInventoryFields" class="color-inventory-fields" hidden></div>
            </section>

            <div class="form-grid" style="margin-top: 15px;">
                <div class="form-group">
                    <label data-i18n="sizeGuideLabel">دليل المقاسات كصورة (Size Guide Image)</label>
                    <input type="file" id="adminProductSizeGuide" accept="image/*">
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>صورة غلاف القسم (Section Cover - اختياري للرئيسية)</label>
                <input type="file" id="adminSectionCover" accept="image/*">
            </div>

            <button type="submit" class="save-btn" style="margin-top: 20px;" data-i18n="saveProduct">حفظ المنتج
                والبيانات</button>
            <div id="adminMsg"
                style="display: none; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: center;"></div>
        </form>

        <section class="announcement-settings" aria-labelledby="announcementHeading">
            <h2 id="announcementHeading">Announcement / Offer</h2>
            <form id="announcementForm">
                <label class="announcement-toggle" for="announcementEnabled">
                    <input type="checkbox" id="announcementEnabled">
                    <span>Enable Announcement</span>
                </label>
                <div class="form-group">
                    <label for="announcementText">Announcement Text</label>
                    <textarea id="announcementText" rows="3"></textarea>
                </div>
                <div class="announcement-colors">
                    <div class="form-group">
                        <label for="announcementBackgroundColor">Background Color</label>
                        <input type="color" id="announcementBackgroundColor" value="#2B1142">
                    </div>
                    <div class="form-group">
                        <label for="announcementTextColor">Text Color</label>
                        <input type="color" id="announcementTextColor" value="#FFFFFF">
                    </div>
                </div>
                <button type="submit" class="save-btn">Save Announcement</button>
            </form>
        </section>

        <section class="home-banners-admin" aria-labelledby="homeBannersHeading">
            <h2 id="homeBannersHeading">Home Hero Banner</h2>
            <form id="homeBannerForm" class="home-banner-form" hidden>
                <div class="form-group">
                    <label for="homeBannerImage">Banner image</label>
                    <input type="file" id="homeBannerImage" accept="image/*">
                </div>
                <div id="homeBannerPreviewFrame" class="home-hero-frame home-banner-preview-frame" aria-label="Banner crop preview" hidden>
                    <img id="homeBannerPreview" class="home-hero-image" alt="Home Hero Banner preview" hidden>
                </div>
                <p class="home-banner-position-help">Drag the image to position it. Zoom in for more movement.</p>
                <label class="home-banner-zoom" for="homeBannerZoom">
                    <span>Zoom</span>
                    <input type="range" id="homeBannerZoom" min="1" max="3" step="0.01" value="1">
                </label>
                <p id="homeBannerStatus" class="home-banner-status"></p>
                <label class="announcement-toggle" for="homeBannerEnabled">
                    <input type="checkbox" id="homeBannerEnabled">
                    <span>Enabled</span>
                </label>
                <div class="home-banner-actions">
                    <button type="submit" id="saveHomeBanner" class="save-btn">Save Banner</button>
                    <button type="button" id="deleteHomeBanner" class="home-banner-delete" disabled>Delete Banner</button>
                </div>
            </form>
            <p id="homeBannerMessage" class="home-banner-message" role="status" aria-live="polite"></p>
        </section>

        <div class="products-header" style="margin-top: 40px;">
            <h2>المنتجات المضافة</h2>
            <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder"
                placeholder="بحث باسم المنتج أو القسم...">
        </div>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>المنتج</th>
                        <th>القسم</th>
                        <th>الحالة</th>
                        <th>السعر</th>
                        <th>التحكم</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="asset/js/admin.js"></script>
    <script type="module" src="asset/js/home-banners-admin.js"></script>
    <script type="module" src="asset/js/i18n.js"></script>
    <script type="module" src="asset/js/motion.js"></script>
</body>

</html>
