    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHAM | Product Details</title>
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="asset/css/responsive.css">
    <link rel="stylesheet" href="asset/css/all.min.css">
</head>

<body>
<!-- شاشة تحميل متجر خام -->
<div id="kham-loader" class="kham-loader-wrapper">
    <div class="kham-spinner"></div>
    <div class="kham-brand-text">KHAM</div>
</div>

    <div id="nav-placeholder"></div>
    <section class="product-details-container container">
        <div class="product-gallery">
            <div class="main-img-wrapper">
                <img id="mainImage" class="main-img" src="" loading="lazy">
            </div>
            <div id="thumbs" class="thumbs"></div>
        </div>
        <div class="product-info">
            <h1 id="productTitle" class="product-title"></h1>

            <div class="price-row">
                <span id="productPrice" class="price"></span>
            </div>

            <div class="options-group">
                <p id="currentColor" class="option-label">Color: Select</p>
                <div id="colorDots" class="color-dots"></div>
            </div>

            <div class="options-group">
                <p class="option-label">Size</p>
                <div id="sizeSelector" class="size-selector">
                </div>
            </div>

            <div class="quantity-selector">
                <button id="minusBtn">-</button>
                <span id="qty">1</span>
                <button id="plusBtn">+</button>
            </div>

            <button id="sizeGuideBtn" class="size-guide-btn" data-i18n="sizeGuide">Size Guide</button>
            <div id="sizeGuideBox" class="size-guide-box">
                <img id="sizeGuideImage" src="">
            </div>

            <div class="action-buttons">
                <button class="btn-cart" onclick="addToCartFromDetails()" data-i18n="addToCart">Add to Cart</button>
                <button class="btn-buy" id="buyNowBtn" data-i18n="buyNow">Buy it now</button>
            </div>

            <div class="product-desc">
                <p id="productDesc"></p>
            </div>

        </div>

    </section>

    <div id="footer-placeholder"></div>

    <script type="module" src="asset/js/store.js"></script>
    <script type="module" src="asset/js/cart.js"></script>
    <script type="module" src="asset/js/details.js"></script>
    <script type="module" src="asset/js/main.js"></script>
    <script type="module" src="asset/js/i18n.js"></script>
    <script type="module" src="asset/js/all.min.js"></script>
</body>

</html>
